# 平台前端（容器化 SPA）+ HTTPS —— V1.49
#
# 前端镜像在 127.0.0.1:4180 提供静态 SPA；宿主机 Nginx 只处理公司域名、TLS 和反向代理。
# 证书换成公司内网 CA 签发的、浏览器信任的证书。

server {
    listen 80;
    server_name review.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name review.corp.example;

    ssl_certificate     /etc/ssl/crp/review.crt;
    ssl_certificate_key /etc/ssl/crp/review.key;

    # SPA 深链接回退、带 hash 的 assets 缓存和 index.html 不缓存，均由镜像内
    # `web-server.mjs` 完成。这里不再依赖 /srv/crp/www/review/ 上的一份手工 dist。
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4180;
    }

    access_log /var/log/nginx/crp-review.access.log;
    error_log  /var/log/nginx/crp-review.error.log;
}
