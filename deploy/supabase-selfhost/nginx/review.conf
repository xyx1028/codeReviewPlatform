# 平台前端（静态 SPA）+ HTTPS —— V1.48
#
# dist/ 由 `npm run build:selfhost` 产出，复制到 /srv/crp/www/review/。
# 证书换成公司内网 CA 签发的、浏览器信任的证书。

server {
    listen 80;
    server_name review.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name review.corp.example;

    ssl_certificate     /etc/ssl/crp/review.crt;
    ssl_certificate_key /etc/ssl/crp/review.key;

    root /srv/crp/www/review;
    index index.html;

    # SPA 深链接回退。少了这一行，`/batches/<id>/ai-result`（MCP 回执里的链接）
    # 直接打开会 404 —— 首页能进、链接打不开，是最容易漏测的一种坏法。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 绝不能缓存，否则发版后仍加载旧 JS。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    access_log /var/log/nginx/crp-review.access.log;
    error_log  /var/log/nginx/crp-review.error.log;
}
