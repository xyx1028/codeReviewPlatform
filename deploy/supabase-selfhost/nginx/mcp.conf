# 远程 MCP 对外入口 —— V1.48
#
# Streamable HTTP 的三个必须项，缺一个就是"能连上但工具调用卡住/断开"：
#
# 1. **proxy_buffering off**：MCP 的响应是 SSE 流。开着缓冲，Nginx 会攒够一块才发，
#    客户端那边表现为"一直转圈然后超时"。
# 2. **不吞 Authorization 与 Mcp-Session-Id**：凭证在服务端 HTTP 层校验，
#    会话 id 用来认会话；任何一个被过滤掉，结果分别是 401 和 400。
# 3. **长超时 + 不关 keepalive**：initialize 之后客户端会保持一条 GET 流等服务端消息。

server {
    listen 80;
    server_name mcp.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.corp.example;

    ssl_certificate     /etc/ssl/crp/mcp.crt;
    ssl_certificate_key /etc/ssl/crp/mcp.key;

    location /mcp {
        proxy_pass http://127.0.0.1:8848/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 显式转发；Nginx 默认会传大部分请求头，但这两个值错了都只表现为"连不上"，
        # 写出来比靠默认行为可靠。
        proxy_set_header Authorization   $http_authorization;
        proxy_set_header Mcp-Session-Id  $http_mcp_session_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查，不需要凭证。监控用它判断进程活着。
    location = /healthz {
        proxy_pass http://127.0.0.1:8848/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/crp-mcp.access.log;
    error_log  /var/log/nginx/crp-mcp.error.log;
}
