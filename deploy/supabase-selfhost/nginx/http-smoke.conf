# 临时内网 HTTP 冒烟配置（不使用证书）。
#
# 仅用于证书下发前确认：DNS、Nginx、统一应用镜像、前端路由和 Supabase API 可达。
# 不要与 review.conf / supabase.conf 同时安装；它们使用相同域名但监听 HTTPS 443。
# 证书到位后，删除本文件对应的 /etc/nginx/conf.d/crp-http-smoke.conf，改用
# review.conf + supabase.conf。

server {
    listen 80;
    server_name crp-review.kingdee.com;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4180;
    }

    access_log /var/log/nginx/crp-review-http-smoke.access.log;
    error_log  /var/log/nginx/crp-review-http-smoke.error.log;
}

server {
    listen 80;
    server_name crp-supabase.kingdee.com;

    client_max_body_size 50m;

    # Studio 仍不对外暴露。
    location / {
        return 404;
    }

    location /auth/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /rest/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /storage/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /functions/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /realtime/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /graphql/v1 {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /.well-known/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }

    access_log /var/log/nginx/crp-supabase-http-smoke.access.log;
    error_log  /var/log/nginx/crp-supabase-http-smoke.error.log;
}
