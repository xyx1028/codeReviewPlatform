# 复制到 /etc/nginx/snippets/crp-supabase-proxy.conf
#
# supabase.conf 的每个 API location 都 include 它，避免七处重复的 proxy_set_header
# 漂移成七种写法。

proxy_pass http://127.0.0.1:54341;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Realtime 走 WebSocket。前端目前不依赖它，留着免得以后开了才发现被掐。
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $http_upgrade;

# Edge Functions 与大文件上传会超过默认 60 秒
proxy_read_timeout 300s;
proxy_send_timeout 300s;
