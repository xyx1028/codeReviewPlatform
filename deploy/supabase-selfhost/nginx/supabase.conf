# 内网 Supabase API 对外入口 —— V1.48
#
# 只转发 **API 前缀**，不转发 `/`。
#
# 这不是洁癖：v0.8.2 的网关把 `/` 路由给 Studio（只有 DASHBOARD_USERNAME/PASSWORD
# 的 basic auth）。整站 proxy_pass 过去，等于把数据库管理台挂在公司域名上。
# 下面的前缀取自官方 `volumes/api/envoy/lds.template.yaml` 的实际路由表。
# 管理员要用 Studio 就走 SSH 隧道：ssh -L 8000:127.0.0.1:54341 <server>。

server {
    listen 80;
    server_name supabase.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name supabase.corp.example;

    ssl_certificate     /etc/ssl/crp/supabase.crt;
    ssl_certificate_key /etc/ssl/crp/supabase.key;

    # 需求附件、技能包都走 Storage；默认 1MB 会让上传在网关这一层就失败，
    # 且错误信息看起来像后端 bug。与 Supabase 的 FILE_SIZE_LIMIT 对齐。
    client_max_body_size 50m;

    # 默认拒绝。新增 API 前缀时在下面显式加 location，而不是放开 `/`。
    location / {
        return 404;
    }

    location /auth/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /rest/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /storage/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /functions/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /realtime/v1/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    location /graphql/v1 {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }
    # 非对称 JWT 时客户端会取 JWKS；留着免得以后换 key 体系才发现被 404 拦了。
    location /.well-known/ {
        include /etc/nginx/snippets/crp-supabase-proxy.conf;
    }

    access_log /var/log/nginx/crp-supabase.access.log;
    error_log  /var/log/nginx/crp-supabase.error.log;
}
