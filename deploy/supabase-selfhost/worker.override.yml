# Worker deployment overlay for the company Linux host (V1.49).
#
# The Worker joins only the existing Supabase network.  Do not add a default
# network here: Docker would choose a fresh 172.x subnet, which previously
# overlapped with company routing.
services:
  worker:
    networks:
      - supabase

networks:
  supabase:
    external: true
    name: crp-selfhost-net
