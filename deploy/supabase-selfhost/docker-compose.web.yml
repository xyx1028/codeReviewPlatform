# Browser SPA service from the same immutable release image as the Worker.
# This Compose project joins only the existing fixed 10.255.0.0/24 Supabase
# network, so it cannot create another auto-selected 172.x bridge network.
services:
  web:
    image: ${CRP_APP_IMAGE:?set CRP_APP_IMAGE to the CI-built application image digest}
    command: ["node", "web-server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:8080"
    networks:
      - supabase
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${CRP_WEB_RUNTIME_CONFIG:?set CRP_WEB_RUNTIME_CONFIG to the Linux runtime-config.js path}:/app/dist/runtime-config.js:ro
    # A Dockerfile health check would also apply to the Worker role, where port
    # 8080 is intentionally absent.  Keep the HTTP health check service-local.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/__health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  supabase:
    external: true
    name: crp-selfhost-net
