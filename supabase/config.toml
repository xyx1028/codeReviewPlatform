project_id = "codeReviewPlatform"

[auth]
# Local Vite frontend. Supabase Auth uses this URL when constructing email
# confirmation links and only redirects to explicitly allowed local origins.
site_url = "http://localhost:5173"
# 重置密码邮件会回到 /reset-password，所以白名单要能匹配子路径（通配）。
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# 体验期关闭邮箱归属确认：GoTrue 仍校验邮箱地址格式，但新注册用户会直接取得会话。
# 云端发布请在 Dashboard 的 Authentication → Providers → Email 单独关闭 Confirm email。
# 此文件带有本地 site_url，不要用整份 `supabase config push` 覆盖云端设置。
enable_confirmations = false

[functions.wechat-auth]
verify_jwt = false

# 本地专用：`supabase db reset` 后自动执行 seed.sql（预制本地管理员账号）。
# 仅影响本地环境，seed 不会被 `supabase db push` 推送到云端。
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
