project_id = "codeReviewPlatform"

[auth]
# Local Vite frontend. Supabase Auth uses this URL when constructing email
# confirmation links and only redirects to explicitly allowed local origins.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Match the cloud flow: newly registered users must confirm their email before
# they can sign in. Local confirmation messages are captured by Mailpit.
enable_confirmations = true

[functions.wechat-auth]
verify_jwt = false

# 本地专用：`supabase db reset` 后自动执行 seed.sql（预制本地管理员账号）。
# 仅影响本地环境，seed 不会被 `supabase db push` 推送到云端。
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
